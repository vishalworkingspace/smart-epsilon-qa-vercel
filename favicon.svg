<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a13"/>
    </linearGradient>
    <linearGradient id="epsilonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(59, 130, 246, 0.3)" stroke-width="8"/>

  <!-- Glowing Outer Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(59, 130, 246, 0.15)" stroke-width="16"/>

  <!-- Epsilon Stylized Crest Symbol (E) -->
  <g filter="url(#glow)">
    <!-- Back Spine -->
    <path d="M160 120 H352 C369.673 120 384 134.327 384 152 C384 169.673 369.673 184 352 184 H224 V232 H320 C337.673 232 352 246.327 352 264 C352 281.673 337.673 296 320 296 H224 V344 H352 C369.673 344 384 358.327 384 376 C384 393.673 369.673 408 352 408 H160 C137.909 408 120 390.091 120 368 V160 C120 137.909 137.909 120 160 120 Z" fill="url(#epsilonGrad)"/>
    
    <!-- Smart Green Dot Accent -->
    <circle cx="384" cy="152" r="24" fill="url(#greenAccent)"/>
  </g>
</svg>
