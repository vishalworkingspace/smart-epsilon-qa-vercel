<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA Audit Document Viewer — Smart Epsilon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <style>
        :root {
            --bg-dark: #070a13;
            --bg-card: #0f172a;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            line-height: 1.7;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #60a5fa;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 10px 18px;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            transition: all 0.2s ease;
        }
        .back-btn:hover {
            background: rgba(59, 130, 246, 0.25);
            color: #fff;
        }
        .markdown-body {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        .markdown-body h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 20px; color: #fff; border-bottom: 1px solid var(--border-color); padding-bottom: 12px; }
        .markdown-body h2 { font-size: 1.6rem; font-weight: 700; margin-top: 32px; margin-bottom: 16px; color: #93c5fd; }
        .markdown-body h3 { font-size: 1.25rem; font-weight: 700; margin-top: 24px; margin-bottom: 12px; color: #c084fc; }
        .markdown-body p { margin-bottom: 16px; color: #cbd5e1; font-size: 1rem; }
        .markdown-body ul, .markdown-body ol { margin-bottom: 20px; padding-left: 24px; color: #cbd5e1; }
        .markdown-body li { margin-bottom: 8px; }
        .markdown-body table { width: 100%; border-collapse: collapse; margin: 24px 0; background: rgba(255,255,255,0.02); border-radius: 12px; overflow: hidden; }
        .markdown-body th, .markdown-body td { padding: 14px 18px; border: 1px solid var(--border-color); text-align: left; }
        .markdown-body th { background: rgba(59, 130, 246, 0.15); color: #60a5fa; font-weight: 700; }
        .markdown-body code { font-family: 'JetBrains Mono', monospace; background: rgba(255,255,255,0.08); padding: 3px 8px; border-radius: 6px; color: #f472b6; font-size: 0.9em; }
        .markdown-body hr { border: none; border-top: 1px solid var(--border-color); margin: 32px 0; }
        .markdown-body blockquote { border-left: 4px solid var(--accent-blue); padding-left: 16px; color: var(--text-muted); font-style: italic; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <a href="./master_qa_index.html" class="back-btn">← Back to Master QA Portal</a>
            <span style="color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.85rem;" id="doc-filename">Document Viewer</span>
        </div>
        <div class="markdown-body" id="content">
            <p style="text-align:center; color:var(--text-muted);">Loading document markdown...</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file') || 'qa_audit_home_page.md';
        document.getElementById('doc-filename').innerText = file;

        fetch('./' + file)
            .then(res => {
                if (!res.ok) throw new Error('File not found');
                return res.text();
            })
            .then(mdText => {
                document.getElementById('content').innerHTML = marked.parse(mdText);
            })
            .catch(err => {
                document.getElementById('content').innerHTML = `<div style="text-align:center; padding:40px;">
                    <h2 style="color:#ef4444;">❌ Document Failed to Load</h2>
                    <p style="color:#94a3b8; margin-top:10px;">The requested file <code>${file}</code> could not be found or processed.</p>
                </div>`;
            });
    </script>
</body>
</html>
